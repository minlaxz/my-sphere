<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="minlaxz">
  <defs>
    <radialGradient id="core" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#bfdbff" />
      <stop offset="70%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#60a5fa" stop-opacity="0" />
      <stop offset="80%" stop-color="#60a5fa" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- dark rounded tile -->
  <rect width="64" height="64" rx="14" fill="#0b1020" />

  <!-- glow halo -->
  <circle cx="32" cy="32" r="26" fill="url(#halo)" />

  <!-- orbit rings -->
  <g stroke="#cbd5e1" stroke-opacity="0.30" fill="none" stroke-width="1.4">
    <ellipse cx="32" cy="32" rx="21" ry="8" />
    <ellipse cx="32" cy="32" rx="21" ry="8" transform="rotate(60 32 32)" />
    <ellipse cx="32" cy="32" rx="21" ry="8" transform="rotate(120 32 32)" />
  </g>

  <!-- core sphere -->
  <circle cx="32" cy="32" r="11.5" fill="url(#core)" />

  <!-- orbiting nodes -->
  <circle cx="53" cy="32" r="2.6" fill="#f8fafc" />
  <circle cx="20.5" cy="50.5" r="2.2" fill="#60a5fa" />
  <circle cx="20.5" cy="13.5" r="2" fill="#cbd5e1" />
</svg>
